{{ define "main" }}
<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand">signal2sip</span>
    <nav class="langswitch" aria-label="Language">
      {{ range .AllTranslations.ByLanguage }}
      <a href="{{ .Permalink }}"{{ if eq .Language.Lang $.Language.Lang }} class="current" aria-current="true"{{ end }}>{{ .Language.LanguageName }}</a>
      {{ end }}
    </nav>
  </div>
</header>

<main class="wrap content">
  <h1>{{ .Title }}</h1>
  {{ with .Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
  {{ .Content }}
</main>

<footer class="wrap footer">
  <a href="{{ .Site.Params.github }}">{{ i18n "view_on_github" }}</a>
  <span class="sep">·</span>
  <span>{{ i18n "license_notice" }}</span>
</footer>
{{ end }}
