baseURL = 'https://signal2sip.github.io/'
title = 'signal2sip'
theme = 'hextra'
enableRobotsTXT = true
enableGitInfo = false
hasCJKLanguage = false

defaultContentLanguage = 'en'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[languages]
  [languages.en]
    label = 'English'
    weight = 1
    title = 'signal2sip'
  [languages.uk]
    label = 'Українська'
    weight = 2
    title = 'signal2sip'
  [languages.ru]
    label = 'Русский'
    weight = 3
    title = 'signal2sip'
  [languages.pl]
    label = 'Polski'
    weight = 4
    title = 'signal2sip'
  [languages.de]
    label = 'Deutsch'
    weight = 5
    title = 'signal2sip'
  [languages.fr]
    label = 'Français'
    weight = 6
    title = 'signal2sip'
  [languages.it]
    label = 'Italiano'
    weight = 7
    title = 'signal2sip'
  [languages.es]
    label = 'Español'
    weight = 8
    title = 'signal2sip'
  [languages.pt]
    label = 'Português'
    weight = 9
    title = 'signal2sip'

[params]
  description = "Bridge Signal messenger calls to your own SIP/PBX infrastructure."

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      width = "28"
      height = "28"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

[[menu.main]]
  name = "Documentation"
  pageRef = "/docs"
  weight = 0

[[menu.main]]
  name = "Theme"
  weight = 1
  [menu.main.params]
    type = "theme-toggle"

[[menu.main]]
  name = "Language"
  weight = 2
  [menu.main.params]
    type = "language-switch"

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/signal2sip/signal2sip"
  weight = 3
  [menu.main.params]
    icon = "github"
